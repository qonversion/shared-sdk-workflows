name: One-click release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version part to bump: patch, minor or major. Ignored when version is set'
        required: false
        type: string
        default: 'patch'
      version:
        description: 'Explicit release version like 5.13.2. Overrides bump'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'Release notes markdown. When empty, GitHub auto-generated notes are used'
        required: false
        type: string
        default: ''
      lib:
        description: 'Library name for multi-package repositories (android-sdk: sdk or nocodes)'
        required: false
        type: string
        default: ''
    secrets:
      GH_TOKEN:
        required: true

jobs:
  release:
    name: Create and merge release pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
      LIB: ${{ inputs.lib }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$LIB" ]; then
            tag_regex="^$LIB/[0-9]+\.[0-9]+\.[0-9]+$"
            branch_prefix="release-$LIB"
          else
            tag_regex="^[0-9]+\.[0-9]+\.[0-9]+$"
            branch_prefix="release"
          fi

          # Only a versioned release branch (release/1.2.3, release-sdk/1.2.3) means an unfinished release.
          # Feature branches that merely start with the prefix (e.g. release/rc-v2) must not block releases.
          open_prs=$(gh pr list --state open --json headRefName \
            --jq "[.[] | select(.headRefName | test(\"^$branch_prefix/[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\"))] | length")
          if [ "$open_prs" != "0" ]; then
            echo "::error::Open $branch_prefix/x.y.z pull requests found. Finish or close the previous release first."
            exit 1
          fi

          if [ -n "$EXPLICIT_VERSION" ]; then
            version="$EXPLICIT_VERSION"
          else
            last_version=$(git tag -l | grep -E "$tag_regex" | sed "s|^$LIB/||" | sort -V | tail -n 1)
            if [ -z "$last_version" ]; then
              echo "::error::No release tags found to calculate the next version from. Pass an explicit version."
              exit 1
            fi
            IFS='.' read -r major minor patch <<< "$last_version"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
              *) echo "::error::Unknown bump type: $BUMP"; exit 1 ;;
            esac
          fi

          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version: $version"
            exit 1
          fi

          case "$LIB" in
            "") title="Release $version" ;;
            sdk) title="Qonversion Release $version" ;;
            nocodes) title="No-Codes Release $version" ;;
            *) title="$LIB Release $version" ;;
          esac

          echo "Releasing version $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "branch=$branch_prefix/$version" >> $GITHUB_OUTPUT
          echo "title=$title" >> $GITHUB_OUTPUT

      - name: Bump version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$LIB" ]; then
            fastlane bump lib:"$LIB" version:"$VERSION"
          else
            fastlane bump version:"$VERSION"
          fi

      - name: Push release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git checkout -b "$BRANCH"
          git commit -am "Bump version to $VERSION"
          git push origin "$BRANCH"

      - name: Create pull requests
        id: prs
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          TITLE: ${{ steps.version.outputs.title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          {
            echo "Release PR"
            if [ -n "$RELEASE_NOTES" ]; then
              echo ""
              echo "<!-- release-notes:start -->"
              printf '%s\n' "$RELEASE_NOTES"
              echo "<!-- release-notes:end -->"
            fi
          } > /tmp/main_pr_body.md

          gh label create one-click-release \
            --description "Pull requests handled by the one-click release automation" \
            --color 0E8A16 2>/dev/null || true
          gh label create autocreated --color EDEDED 2>/dev/null || true

          main_pr=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file /tmp/main_pr_body.md)

          # Labels are attached through the REST API on purpose: `gh pr edit
          # --add-label` needs the read:org scope the PAT may not have. This
          # step must fail loudly — the publish_release workflow only reacts
          # to release PRs carrying the one-click-release label.
          gh api "repos/$GH_REPO/issues/${main_pr##*/}/labels" \
            -f "labels[]=autocreated" -f "labels[]=one-click-release" > /dev/null

          echo "main_pr=$main_pr" >> $GITHUB_OUTPUT

      - name: Approve pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PR: ${{ steps.prs.outputs.main_pr }}
        run: |
          gh pr review "$MAIN_PR" --approve || \
            echo "::warning::Could not approve the main PR. Check that 'Allow GitHub Actions to create and approve pull requests' is enabled, or approve manually: $MAIN_PR"

      # Always waits for CI explicitly instead of relying on auto-merge:
      # without required status checks a fresh PR is instantly "clean", and
      # `gh pr merge --auto` merges it right away, before the checks even
      # register — the release would ship ungated.
      - name: Merge release pull request to main
        env:
          MAIN_PR: ${{ steps.prs.outputs.main_pr }}
        run: |
          echo "Looking for checks on $MAIN_PR..."
          has_checks=""
          for _ in $(seq 1 10); do
            if [ -n "$(gh pr checks "$MAIN_PR" 2>/dev/null | head -n 1)" ]; then
              has_checks=1
              break
            fi
            sleep 30
          done

          if [ -n "$has_checks" ]; then
            gh pr checks "$MAIN_PR" --watch --fail-fast
          else
            # The admin merge below bypasses required status checks too, so this wait is the only CI gate left:
            # no checks within 5 minutes means an Actions incident — stop, do not ship an unverified bump.
            echo "::error::No checks appeared on $MAIN_PR within 5 minutes; refusing to merge without a CI gate. Merge or close $MAIN_PR by hand once CI is back."
            exit 1
          fi

          # The release PR is an auto-generated version bump that nobody reviews by hand; the gate is the CI wait
          # above. Review bots (CodeRabbit "pre-merge checks") can still leave a "changes requested" review on it,
          # which the base branch policy turns into a hard block (qonversion-ios-sdk#770 stranded the 6.17.0
          # release that way). `--admin` skips gh's client-side mergeability check; the server then lets a repo
          # admin (GH_TOKEN is a PAT with admin on every SDK repo) merge past reviews and required checks, and
          # still refuses loudly where "Do not allow bypassing" or a ruleset says so.
          gh pr merge "$MAIN_PR" --merge --admin
