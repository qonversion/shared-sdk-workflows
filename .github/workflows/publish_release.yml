name: Publish release

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true

jobs:
  publish_release:
    name: Create GitHub release and sync develop
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Parse release info
        id: info
        run: |
          # Supported branch formats: release/1.2.3, release-sdk/1.2.3, release-nocodes/1.2.3
          prefix="${HEAD_REF%%/*}"
          version="${HEAD_REF#*/}"
          case "$prefix" in
            release) lib="" ;;
            release-*) lib="${prefix#release-}" ;;
            *) echo "::error::$HEAD_REF is not a release branch"; exit 1 ;;
          esac

          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Cannot parse a version from branch $HEAD_REF"
            exit 1
          fi

          case "$lib" in
            "") tag="$version"; title="$version" ;;
            sdk) tag="sdk/$version"; title="Qonversion $version" ;;
            nocodes) tag="nocodes/$version"; title="No-Codes $version" ;;
            *) tag="$lib/$version"; title="$lib $version" ;;
          esac

          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "title=$title" >> $GITHUB_OUTPUT

      - name: Extract release notes from the pull request body
        id: notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          notes=$(printf '%s\n' "$PR_BODY" | sed -n '/<!-- release-notes:start -->/,/<!-- release-notes:end -->/p' | sed '1d;$d')
          {
            echo "notes<<NOTES_EOF_MARKER"
            printf '%s\n' "$notes"
            echo "NOTES_EOF_MARKER"
          } >> $GITHUB_OUTPUT

      # The release is created with the PAT on purpose: releases created with
      # the default GITHUB_TOKEN do not trigger the publish workflows listening
      # to the release:[released] event.
      - name: Create GitHub release
        env:
          TAG: ${{ steps.info.outputs.tag }}
          TITLE: ${{ steps.info.outputs.title }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > /tmp/release_notes.md
            gh release create "$TAG" --target "$MERGE_SHA" --title "$TITLE" --notes-file /tmp/release_notes.md --latest
          else
            gh release create "$TAG" --target "$MERGE_SHA" --title "$TITLE" --generate-notes --latest
          fi

      - name: Merge release pull request to develop
        run: |
          pr=$(gh pr list --state all --head "$HEAD_REF" --base develop --json number,state,mergedAt --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "::warning::No develop pull request found for $HEAD_REF. Sync the version bump to develop manually."
            exit 0
          fi

          number=$(echo "$pr" | jq -r .number)
          state=$(echo "$pr" | jq -r .state)
          merged_at=$(echo "$pr" | jq -r .mergedAt)

          if [ "$merged_at" != "null" ]; then
            echo "Develop PR #$number is already merged."
            exit 0
          fi

          if [ "$state" = "CLOSED" ]; then
            echo "Develop PR #$number was closed (the head branch was likely auto-deleted on merge). Restoring..."
            head_sha=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
            gh api -X POST "repos/$GH_REPO/git/refs" -f "ref=refs/heads/$HEAD_REF" -f "sha=$head_sha" || true
            gh pr reopen "$number"
          fi

          gh pr merge "$number" --merge || \
            gh pr merge "$number" --auto --merge || \
            echo "::warning::Could not merge develop PR #$number automatically. Merge it manually to keep the version files on develop in sync."
